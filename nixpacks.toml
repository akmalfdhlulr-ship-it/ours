# ==============================================================================
# nixpacks.toml — Nixpacks Build Configuration for OURS Monorepo on Railway
# ==============================================================================

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm", "openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.9.0 --activate || npm install -g pnpm@11.9.0",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @ours/database exec prisma generate",
  "pnpm build"
]

[start]
cmd = "node apps/api/dist/main.js"
